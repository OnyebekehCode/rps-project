<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <script src="index.js"></script>
</head>
<body>
    <div id="container">
        <div id="score-container">
            <div class="score">
                <h1>Player</h1>
                <button id="human">Player score</button>
            </div>
            <div class="score">
                <h1>Computer</h1>
                <button id="Computer">Computer score</button>
            </div>
        </div>
        <div id="selection-container">
            <div class="selection">
                <button id="rock">rock</button>
            </div>
            <div class="selection">
                <button id="paper">paper</button>
            </div>
            <div class="selection">
                <button id="scissors">scissors</button>
            </div>
        </div>
        <button id="scoresheet">score</button>

    </div>

</body>
</html>
